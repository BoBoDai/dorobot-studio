[package]
name = "dorobot-nano-runtime"
version = "0.1.0-rc.2"
edition = "2024"
license = "MIT"
default-run = "dorobot-nano-runtime"

[[bin]]
name = "dorobot-so101-session"
path = "src/bin/dorobot-so101-session.rs"
required-features = ["physics"]

# Keep GPU/toolchain dependencies separate from Makepad's pinned JIT dependency set.
[workspace]
exclude = ["vendor/nexus", "vendor/khal", "vendor/vortx"]

[features]
default = ["physics"]
physics = ["dep:nexus3d", "dep:nexus_viewer3d", "dep:rapier3d-urdf", "dep:pollster", "dep:kiss3d", "dep:khal", "dep:glamx"]

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
dora-node-api = { version = "=1.0.1", default-features = false }
gilrs = "0.11"
serialport = { version = "4", default-features = false }
urdf-rs = "0.9"
stl_io = "0.8"
ndarray = "0.16"
ndarray-npy = { version = "0.9", features = ["compressed_npz"] }
sha2 = "0.10"
arrow-array = "56"
arrow-schema = "56"
parquet = { version = "56.1", default-features = false, features = ["arrow", "snap"] }
ffmpeg-next = "=8.0.0"
khal = { version = "0.4", optional = true }
glamx = { version = "0.3", optional = true }
pollster = { version = "1", optional = true }
nexus3d = { path = "vendor/nexus/crates/nexus3d", features = ["rbd"], optional = true }
nexus_viewer3d = { path = "vendor/nexus/crates/nexus_viewer3d", optional = true }
rapier3d-urdf = { version = "0.36.0", features = ["stl"], optional = true }
kiss3d = { version = "0.47.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nexus3d = { path = "vendor/nexus/crates/nexus3d", features = ["metal"], optional = true }
nexus_viewer3d = { path = "vendor/nexus/crates/nexus_viewer3d", features = ["metal"], optional = true }

[patch.crates-io]
khal = { path = "vendor/khal/crates/khal" }
khal-derive = { path = "vendor/khal/crates/khal-derive" }
khal-std = { path = "vendor/khal/crates/khal-std" }
khal-builder = { path = "vendor/khal/crates/khal-builder" }
vortx = { path = "vendor/vortx" }
vortx-shaders = { path = "vendor/vortx/vortx-shaders" }

[profile.release]
opt-level = 3
